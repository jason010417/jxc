<style>
/* Layout: top bar with page tabs, one working column below; documents open as an A4 sheet over the page */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --line:#d3dbd8;
  --fg:#1c2624; --muted:#5d6b67; --accent:#1f5f5b; --accent-fg:#ffffff; --accent-soft:#dcebe8;
  --warn:#a3541a; --warn-soft:#f6e4d4; --ok:#2f6b3a; --ok-soft:#dfeedd; --bad:#a3302a; --bad-soft:#f6dcda;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#999999; --shade:rgba(20,30,28,.55);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-head:"Noto Serif TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --surface-2:#222c29; --line:#33403c;
  --fg:#e3ebe8; --muted:#9aaba6; --accent:#6fbab2; --accent-fg:#0d1513; --accent-soft:#1f3532;
  --warn:#e7a26b; --warn-soft:#3a2a1c; --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ec8e86; --bad-soft:#3d2120; --shade:rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --surface-2:#222c29; --line:#33403c;
  --fg:#e3ebe8; --muted:#9aaba6; --accent:#6fbab2; --accent-fg:#0d1513; --accent-soft:#1f3532;
  --warn:#e7a26b; --warn-soft:#3a2a1c; --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ec8e86; --bad-soft:#3d2120; --shade:rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand h1{font-family:var(--f-head);font-size:20px;margin:0;letter-spacing:.02em}
.brand .tag{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
.brand .spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-head);font-size:22px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:4px 0 0;max-width:62ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile.alert .v{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tablebox{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-bottom:0}
.mono{font-family:var(--f-num);font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:500}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.mid{color:var(--accent);background:var(--accent-soft)}
button.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.small{padding:4px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.line.noprice{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) auto}
@media (max-width:520px){.line,.line.noprice{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.line label.f:first-child{grid-column:1/-1}}
.sub{font-size:13px;font-weight:700;color:var(--fg);margin:4px 0 0}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty{color:var(--muted);padding:12px 0}
/* A4 sheet */
.overlay{position:fixed;inset:0;background:var(--shade);z-index:20;overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheetbar{max-width:794px;margin:0 auto 10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.paper{max-width:794px;margin:0 auto;background:var(--paper);color:var(--paper-ink);aspect-ratio:210/297;padding:5.5% 6.5%;display:flex;flex-direction:column;gap:14px;font-size:clamp(10px,1.7vw,13.5px);box-shadow:0 6px 30px rgba(0,0,0,.25)}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--paper-ink);padding-bottom:8px;gap:10px}
.paper .co{font-size:.9em}
.paper h3{font-family:var(--f-head);font-size:1.9em;margin:0;letter-spacing:.2em}
.paper .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.paper .meta span{color:#555}
.paper table{font-size:1em}
.paper th{background:#eeeeee;color:var(--paper-ink);border:1px solid var(--paper-line);font-size:.92em}
.paper td{border:1px solid var(--paper-line);white-space:normal}
.paper tfoot td{border:1px solid var(--paper-line)}
.paper .grow{flex:1}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper .sign div{border:1px solid var(--paper-line);height:5.5em;padding:4px 6px;font-size:.9em;color:#555}
.paper .foot{font-size:.8em;color:#777;text-align:center}
@page{size:A4 portrait;margin:10mm}
@media print{
  header.top,main,.toast,.sheetbar,body::before{display:none!important}
  .overlay{position:static;background:none;padding:0;overflow:visible}
  .paper{max-width:none;width:100%;aspect-ratio:auto;min-height:270mm;box-shadow:none;padding:0;font-size:11pt}
  body{background:#fff}
  body.print-rcpt .paper.a4{display:none!important}
  body:not(.print-rcpt) .paper.rcpt,.rcpt-label{display:none!important}
  .paper.rcpt{min-height:0;margin:0}
}
.rcpt-label{max-width:794px;margin:18px auto 8px;color:#fff;font-size:14px}
.paper.rcpt{aspect-ratio:auto;padding:4% 5%;gap:0;font-size:clamp(10px,1.6vw,13px)}
.rcpt table{border-collapse:collapse;width:100%}
.rcpt td{border:1px solid var(--paper-ink);padding:.35em .5em;text-align:center;white-space:nowrap}
.rcpt td.n{text-align:right;font-family:var(--f-num)}
.rcpt td.nb{border:0}
.rcpt .rt{font-family:var(--f-head);font-size:2em;font-weight:700;letter-spacing:.15em}
.rcpt .rc{font-size:1.4em}
.rcpt .stamp{vertical-align:top;color:#666;font-size:1.2em}
.rcpt .cap{font-size:1.3em;font-weight:700;letter-spacing:.05em}
.pinfo{background:var(--accent-soft);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;font-size:14px}
.pinfo span{color:var(--muted);font-size:12px;margin-right:4px}
.pinfo .full{grid-column:1/-1}
.pinfo.miss{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft)}
.prog{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.prog i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.prog i.on{background:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.steps li{border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted);min-width:0}
.steps li b{display:block;color:var(--fg);font-size:14px}
.steps li.done{border-color:var(--accent)}
.steps li.cur{border-color:var(--warn)}
.steps li.cur b{color:var(--warn)}
@media (max-width:520px){.steps{grid-auto-flow:row}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .3s}}
.fc-box>summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;cursor:pointer;list-style:none}
.fc-box>summary::-webkit-details-marker{display:none}
.fc-box>summary::before{content:'▸';color:var(--accent);font-size:14px}
.fc-box[open]>summary::before{content:'▾'}
.fc-box>summary .sub{margin:0}
.fc-box[open]{display:flex;flex-direction:column;gap:12px}
.fc-box:not([open]){display:block;padding:12px 16px}
</style>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
/* Firebase Realtime Database 存檔：資料放在 jxc/ 底下，不會動到舊 erp-app 的 erp/ 資料 */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyACV9lvcVKHa8q_Lmdzyg-U1SzmlsGz9Uo",
  authDomain:"erp-app-90278.firebaseapp.com",
  databaseURL:"https://erp-app-90278-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"erp-app-90278",
  storageBucket:"erp-app-90278.firebasestorage.app",
  messagingSenderId:"58148662994",
  appId:"1:58148662994:web:c19221105ba36b0b45470b"
};
(function(){
  const ROOT='jxc';
  let fdb=null,auth=null;
  try{firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();auth=firebase.auth()}catch(e){console.error('Firebase 初始化失敗',e)}
  // Each record is stored as one JSON string so empty arrays and special keys survive the round trip.
  const enc=d=>({j:JSON.stringify(d)});
  const dec=v=>{try{return v&&typeof v.j==='string'?JSON.parse(v.j):null}catch(e){return null}};
  const mapErr=e=>({code:/permission/i.test(String(e&&(e.code||e.message)))?'permission_denied':'unavailable',message:String(e&&e.message||e)});
  const docRef=p=>{const r=fdb.ref(ROOT+'/'+p),id=p.split('/').pop();return{id,path:p,
    get:async()=>{try{const s=await r.get();const d=dec(s.val());return{exists:d!==null,data:()=>d}}catch(e){throw mapErr(e)}},
    set:async d=>{try{await r.set(enc(d))}catch(e){throw mapErr(e)}},
    delete:async()=>{try{await r.remove()}catch(e){throw mapErr(e)}},
    onSnapshot:(fn,err)=>{const cb=s=>{const d=dec(s.val());fn({id,exists:d!==null,data:()=>d,metadata:{}})};
      r.on('value',cb,e=>err&&err(mapErr(e)));return()=>r.off('value',cb)}}};
  const collRef=c=>({path:c,doc:id=>docRef(c+'/'+id),
    onSnapshot:(fn,err)=>{const r=fdb.ref(ROOT+'/'+c);let prev=new Map();
      const cb=s=>{const cur=new Map();s.forEach(ch=>{const v=ch.val();cur.set(ch.key,v&&v.j)});const changes=[];
        for(const [k,j] of cur){if(prev.get(k)===j)continue;const d=dec({j});if(d===null)continue;
          changes.push({type:prev.has(k)?'modified':'added',doc:{id:k,exists:true,data:()=>d}})}
        for(const [k,j] of prev)if(!cur.has(k))changes.push({type:'removed',doc:{id:k,exists:true,data:()=>dec({j})}});
        prev=cur;fn({docChanges:()=>changes,metadata:{}})};
      r.on('value',cb,e=>err&&err(mapErr(e)));return()=>r.off('value',cb)}});
  const db=fdb&&{doc:docRef,collection:collRef};

  // Google 登入：只有 OWNER 和 jxcMembers 名單裡的帳號能讀寫資料（由 Firebase 規則把關）。
  const OWNER='jason010417@gmail.com';
  const mkey=e=>String(e||'').trim().toLowerCase().replace(/\./g,',');
  let resolveDb;const dbReady=new Promise(r=>resolveDb=r);let opened=false;
  window.claude={use:async n=>n==='db'?(db?dbReady:null):null};
  const gate=html=>{const m=document.getElementById('main');if(m)m.innerHTML='<section class="panel" style="max-width:460px;margin:8vh auto;text-align:center">'+html+'</section>'};
  const esc2=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function userBox(u){const b=document.getElementById('userBox');if(b)b.innerHTML=u?esc2(u.email)+' <button type="button" class="link" id="signOut">登出</button>':''}
  window.jxcAuth={
    owner:OWNER,
    email:()=>auth&&auth.currentUser&&auth.currentUser.email,
    isOwner:()=>!!(auth&&auth.currentUser&&auth.currentUser.email&&auth.currentUser.email.toLowerCase()===OWNER),
    members:async()=>{const s=await fdb.ref('jxcMembers').get();const v=s.val()||{};return Object.keys(v).filter(k=>v[k]===true).map(k=>k.replace(/,/g,'.'))},
    addMember:e=>fdb.ref('jxcMembers/'+mkey(e)).set(true),
    removeMember:e=>fdb.ref('jxcMembers/'+mkey(e)).remove()
  };
  if(!auth)return;
  document.addEventListener('click',e=>{
    if(e.target.id==='signIn'){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{
      if(err&&err.code==='auth/popup-blocked'||err&&err.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      else if(!(err&&err.code==='auth/popup-closed-by-user'))alert('登入失敗：'+(err&&err.message||err))})}
    if(e.target.id==='signOut'){auth.signOut().then(()=>location.reload())}
  });
  auth.onAuthStateChanged(async u=>{
    userBox(u);
    if(!u){gate('<h2>小團隊進銷存</h2><p class="lead">請用公司同仁的 Google 帳號登入。</p><button type="button" class="btn primary" id="signIn">用 Google 帳號登入</button>');return}
    if(opened)return;
    let ok=window.jxcAuth.isOwner();
    if(!ok){try{const s=await fdb.ref('jxcMembers/'+mkey(u.email)).get();ok=s.val()===true}catch(e){ok=false}}
    if(!ok){gate('<h2>還不能使用</h2><p class="lead">'+esc2(u.email)+' 還沒有被加入使用名單。請管理者在「權限設定」加入這個帳號，然後重新整理頁面。</p><button type="button" class="btn" id="signOut">換一個帳號</button>');return}
    opened=true;resolveDb(db);
  });
})();
</script>
<script>
const KINDS={
  PO:{name:'採購驗收單',short:'採購',party:'廠商',priced:true,type:'半成品',sign:['驗收人','主管','財務對帳']},
  MO:{name:'生產製造單',short:'生產',party:'負責人',priced:false,sign:['領料人','生產負責人','主管']},
  EX:{name:'外展借還單',short:'外展',party:'活動名稱',priced:false,type:'成品',sign:['帶出人','歸還點收','主管']},
  SO:{name:'銷貨出貨單',short:'銷貨',party:'客戶',priced:true,type:'成品',sign:['出貨人','客戶簽收','財務對帳']}
};
const PAGES=[['home','庫存總表'],['PO','採購'],['MO','生產'],['EX','外展借還'],['SO','銷貨出貨'],['hist','歷史查詢'],['items','品項清單'],['bom','BOM 設定'],['contacts','顧客／廠商']];
const KEY='erp-local-v2';

const SEED={"sources": [["L", "LINE詢問"], ["T", "電話詢問"], ["S", "蝦皮下訂"], ["E", "官網下訂"], ["O", "其他"]]};


const FLOW={
  PO:[{k:'order',t:'下單',done:'已下單'},{k:'recv',t:'到貨驗收',done:'已到貨'},{k:'pay',t:'付款',done:'已付款'}],
  SO:[{k:'order',t:'接單',done:'已接單'},{k:'ready',t:'備貨完成',done:'已備貨'},{k:'ship',t:'出貨',done:'已出貨'},{k:'pay',t:'收款',done:'已收款'}]
};
const STOCK_AT={PO:2,SO:3};
const stepN=d=>FLOW[d.kind]?(d.steps||[]).length:0;
const flowDone=d=>!FLOW[d.kind]||stepN(d)>=FLOW[d.kind].length;
const counts=d=>!STOCK_AT[d.kind]||stepN(d)>=STOCK_AT[d.kind];
function migrate(){S.docs.forEach(d=>{if(!FLOW[d.kind]||d.steps)return;const F=FLOW[d.kind];

let S=null,db=null,ready=false,readOnly=false,syncErr='';

Object.keys(COLL).forEach(k=>remote[k]=new Map());

const clone=v=>JSON.parse(JSON.stringify(v));
function canon(v){if(Array.isArray(v))return'['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function pid(s){s=String(s);return /^[A-Za-z0-9_\-~:@+]{1,200}$/.test(s)?s:'u'+[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,190)}
const newKey=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function save(){
  if(!ready)return;
  if(readOnly){toast('你目前只能查看，這次的變更不會存到雲端');return}
  const want=new Map();
  for(const [k,c] of Object.entries(COLL)){
    const arr=S[k]||(S[k]=[]);let top=arr.reduce((m,e)=>Math.max(m,typeof e._o==='number'?e._o:-1),-1);
    arr.forEach(e=>{if(k!=='items'&&k!=='docs'&&!e._k)e._k=newKey(k[0]);
      if(typeof e._o!=='number')e._o=c.desc?Date.now()+Math.random():++top;
      want.set(k+'/'+pid(c.key(e)),canon(e))});
  }
  const meta={};Object.keys(S).forEach(k=>{if(!COLL[k])meta[k]=S[k]});want.set('erp/meta',canon(meta));
  for(const [p,j] of want)if(shadow.get(p)!==j){if(!shadow.has(p)&&p.startsWith('docs/'))created.add(p);shadow.set(p,j);enqueue(p,JSON.parse(j))}
  for(const p of [...shadow.keys()])if(!want.has(p)){shadow.delete(p);enqueue(p,null)}
}
function enqueue(p,data){if(!pend.has(p))order.push(p);pend.set(p,data);pump()}
function pump(){
  for(let i=0;i<order.length&&running<4;){const p=order[i];if(inflight.has(p)){i++;continue}
    order.splice(i,1);const data=pend.get(p);pend.delete(p);inflight.add(p);running++;
    write(p,data).finally(()=>{inflight.delete(p);running--;pump();syncTag()})}
  syncTag();
}
async function write(p,data,tries=0){
  const [c,id]=p.split('/');const ref=db.collection(c).doc(id);
  try{
    if(data!==null&&created.has(p)){created.delete(p);const cur=await ref.get();
      if(cur.exists&&canon(cur.data())!==canon(data)){renameDoc(data.no);return}}
    if(data===null)await ref.delete();else await ref.set(data);
    syncErr='';
  }catch(e){
    const code=e&&e.code;
    if((code==='unavailable'||code==='resource_exhausted')&&tries<6){await sleep(600*2**tries+Math.random()*400);return write(p,data,tries+1)}
    if(code==='permission_denied'){syncErr='Firebase 拒絕存檔，請檢查資料庫規則';toast(syncErr)}
    else if(code==='invalid_argument'&&!readOnly&&data!==null&&canon(data).length<250000){readOnly=true;syncErr='你目前只能查看，不能修改資料';toast(syncErr)}
    else if(code==='quota_exceeded'){syncErr='雲端空間已滿，請聯絡管理者';toast(syncErr)}
    else{syncErr='有資料沒存成功，請重新整理頁面';toast(syncErr)}
  }
}

}

// Remote changes update objects in place so open screens keep valid references.
function rebuild(k){
  const desc=COLL[k].desc,key=COLL[k].key;
  const old=new Map((S[k]||[]).map(e=>[pid(key(e)),e]));
  const pathBusy=id=>pend.has(k+'/'+id)||inflight.has(k+'/'+id);
  const out=[];
  for(const [id,data] of remote[k]){
    const o=old.get(id);
    if(o&&pathBusy(id)){out.push(o);continue}
    if(o){if(canon(o)!==canon(data)){Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,clone(data))}out.push(o)}
    else out.push(clone(data));
  }
  for(const [id,o] of old)if(!remote[k].has(id)&&pathBusy(id))out.push(o);
  out.sort((a,b)=>desc?(b._o||0)-(a._o||0):(a._o||0)-(b._o||0));
  S[k]=out;
}
function rebuildMeta(){
  Object.keys(S).forEach(k=>{if(!COLL[k])delete S[k]});
  if(metaData)Object.assign(S,clone(metaData));
}
function onData(){
  if(got.size<Object.keys(COLL).length+1)return;
  if(!ready){
    if(!metaData){$('#main').innerHTML='<p class="empty">雲端還沒有資料。</p>';
      ready=true;S.bom={};S.perm=null;S.svcInit=true;S.histImported=true;afterLoad();return}
    ready=true;
    if(!S.bom)S.bom={};
    afterLoad();syncTag();return;
  }
  scheduleRender();
}

async function connect(){
  S={};
  $('#main').innerHTML='<p class="empty">正在讀取雲端資料…</p>';
  db=window.claude&&await window.claude.use('db');
  if(!db){$('#main').innerHTML='<p class="empty">連不上 Firebase，請檢查網路後重新整理頁面。</p>';$('#syncTag').textContent='線上版・未連線';return}
  try{const user=await window.claude.use('user');if(user&&user.can&&(await user.can('data.write'))===false){readOnly=true}}catch(e){}
  const fail=e=>{syncErr='連線中斷，請重新整理頁面';syncTag()};
  for(const k of Object.keys(COLL)){
    db.collection(k).onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const p=k+'/'+ch.doc.id;
        if(ch.type==='removed'){remote[k].delete(ch.doc.id);if(!pend.has(p)&&!inflight.has(p))shadow.delete(p)}
        else{const d=ch.doc.data();remote[k].set(ch.doc.id,d);if(!pend.has(p)&&!inflight.has(p))shadow.set(p,canon(d))}});
      got.add(k);rebuild(k);onData();
    },fail);
  }
  db.doc('erp/meta').onSnapshot(snap=>{
    metaData=snap.exists?snap.data():null;
    if(!pend.has('erp/meta')&&!inflight.has('erp/meta')){if(snap.exists)shadow.set('erp/meta',canon(metaData));rebuildMeta()}
    got.add('meta');onData();
  },fail);
}

const baseQty=i=>S.count?(+S.count.qty[i.id]||0):(+i.open||0);

function stockUntil(to,from){
  const useBase=!!S.count&&(!to||to>=S.count.date);
  const m={};S.items.forEach(i=>m[i.id]={in:0,out:0,bal:useBase?baseQty(i):(+i.open||0)});
  S.docs.forEach(d=>{if(!counts(d))return;const dt=effDate(d);if(to&&dt>to)return;const inR=!from||dt>=from;const inBal=!useBase||dt>=S.count.date;
    d.lines.forEach(l=>{const r=m[l.item];if(!r)return;let a=0,b=0;
      if(d.kind==='PO')a=l.qty;else if(d.kind==='MO'){if(l.dir==='use')b=l.qty;else a=l.qty}
      else if(d.kind==='EX'){b=l.qty;a=l.ret||0}else if(d.kind==='SO')b=l.qty;

function stock(){
  const m={};
  S.items.forEach(i=>m[i.id]={open:baseQty(i),po:0,use:0,made:0,exOut:0,exRet:0,so:0});
  S.docs.forEach(d=>{if(!counts(d)||!afterCount(effDate(d)))return;d.lines.forEach(l=>{const r=m[l.item];if(!r)return;
    if(d.kind==='PO')r.po+=l.qty;

    else if(d.kind==='EX'){r.exOut+=l.qty;r.exRet+=l.ret||0}
    else if(d.kind==='SO')r.so+=l.qty;})});
  Object.values(m).forEach(r=>r.cur=r.open+r.po-r.use+r.made-r.exOut+r.exRet-r.so);
  return m;
}

function shipInfo(d){if(!d.ship)return '';const f=(l,v)=>v?`<div><span>${l}：</span>${esc(v)}</div>`:'';return f('交貨方式',d.ship.method)+f('物流',d.ship.carrier)+f('查貨號碼',d.ship.track)}
function rocDate(iso){const [y,m,d]=iso.split('-').map(Number);return `民國${y-1911}年${m}月${d}日`}
function capNum(n){n=Math.round(n);if(n===0)return '零';const D='零壹貳參肆伍陸柒捌玖',U=['','拾','佰','仟'],B=['','萬','億'];
  const groups=[];while(n>0){groups.push(n%10000);n=Math.floor(n/10000)}
  let out='';
  for(let g=groups.length-1;g>=0;g--){const part=groups[g];
    if(part===0){if(out&&!out.endsWith('零'))out+='零';continue}
    if(out&&part<1000&&!out.endsWith('零'))out+='零';
    let t='';for(let i=3;i>=0;i--){const dg=Math.floor(part/Math.pow(10,i))%10;
      if(dg===0){if(t&&!t.endsWith('零'))t+='零'}else t+=D[dg]+U[i]}
    out+=t.replace(/零$/,'')+B[g]}
  return out.replace(/零$/,'')}

}
document.addEventListener('click',e=>{
  const ob=e.target.closest('.obom');if(ob){openBom(ob.dataset.id);return}
  if(e.target.id==='bomAdd'){$('#bomLines').insertAdjacentHTML('beforeend',bomRow('',''));return}
  const rm=e.target.closest('.brm');if(rm){rm.closest('.line').remove();return}
  if(e.target.id==='bomSave'){if(!can('bom'))return;const id=$('#bomBox').dataset.id;const comps=[];
    document.querySelectorAll('#bomLines .line').forEach(r=>{const i=r.querySelector('.bi').value,q=+r.querySelector('.bq').value;if(i&&q>0&&i!==id)comps.push({item:i,qty:q})});
    const it=S.items.find(x=>x.id===id);
    if(comps.length){S.bom[id]=comps;if(it.type!=='成品'){it.type='成品'}}else delete S.bom[id];
    save();closeDoc();render();toast(comps.length?'已存檔 '+it.name+' 的 BOM（'+comps.length+' 項）':'已清除 '+it.name+' 的 BOM');return}
});

let resetArm=false;
$('#reset').addEventListener('click',e=>{if(!can('data'))return;if(!resetArm){resetArm=true;e.target.textContent='再按一次確認重設';setTimeout(()=>{resetArm=false;e.target.textContent='重設為初始資料'},3000);return}
  resetArm=false;e.target.textContent='重設為初始資料';toast('線上版不提供重設')});

function setRole(r){role=r;try{sessionStorage.setItem('erp-role',r)}catch(e){}renderRole();if(!can('items')&&page==='perm')page='home';renderTabs();render()}
function renderRole(){
  const box=$('#roleBox');
  box.innerHTML=!S.perm.pin?'<button type="button" class="link" id="goPerm">設定管理者密碼</button>':
    `身分：<b>${role==='admin'?'管理者':'一般人員'}</b> <button type="button" class="link" id="${role==='admin'?'toStaff':'toAdmin'}">${role==='admin'?'切換成一般人員':'切換成管理者'}</button>`;
  $('#reset').hidden=true;$('#restoreBtn').hidden=!can('data');
}
document.addEventListener('click',e=>{
  if(e.target.id==='goPerm'){go('perm');return}
  if(e.target.id==='toStaff'){setRole('staff');toast('已切換成一般人員');return}
  if(e.target.id==='toAdmin'){
    $('#overlay').innerHTML=`<form class="sheetbar" id="pwForm" style="max-width:360px;margin-top:10vh"><p class="sub">輸入管理者密碼</p><input id="pwIn" type="password" autocomplete="current-password"><p class="err" id="pwErr"></p><div class="row"><button type="submit" class="btn primary">切換成管理者</button><button type="button" class="btn" id="closeDoc">取消</button></div></form>`;
    $('#overlay').hidden=false;$('#pwIn').focus();return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='pwForm')return;e.preventDefault();
  if(hashPw($('#pwIn').value)===S.perm.pin){closeDoc();setRole('admin');toast('已切換成管理者')}else $('#pwErr').textContent='密碼不對，請再試一次。'});

/* ---------- 盤點重設 ---------- */
let countDate='';
const dayBefore=ds=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function countHTML(){
  const date=countDate||today();
  const sys=stockUntil(dayBefore(date));
  const cur=S.count;
  const rows=S.items.map(i=>`<tr><td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td><td>${i.type}</td><td class="n">${fmt(sys[i.id].bal)}</td><td class="n"><input class="cnt" data-id="${esc(i.id)}" type="number" step="any" value="${sys[i.id].bal}" style="max-width:110px;text-align:right"></td><td>${esc(i.unit)}</td></tr>`).join('');
  return `<div><h2>盤點重設</h2><p class="lead">在盤點日把實際點到的數量填進來，存檔後庫存就從這一天重新起算。盤點日當天和之後的單據會加減在盤點數量上，之前的單據不會被刪掉，只是不再影響庫存，歷史查詢還是看得到。</p></div>
  ${cur?`<section class="panel"><p class="sub" style="margin:0">目前的盤點：<b>${esc(cur.date)}</b>（${esc(cur.at||'')} ${esc(cur.by||'')} 存檔，共 ${Object.keys(cur.qty).length} 項）</p>
    <div class="row"><button type="button" class="btn" id="countClear">取消盤點，改回原本的期初計算</button></div></section>`:''}
  <form class="panel" id="countForm">
    <div class="grid-f"><label class="f">盤點日（這一天開始營業前的數量）<input type="date" id="countDate" value="${date}" required></label>
    <label class="f">盤點人<input id="countBy" placeholder="例如：小美"></label></div>
    <p class="hint">「系統數量」是盤點日前一天結束時系統算出的庫存，已經先填進「實際數量」；只要改有差異的品項就好。</p>
    <input class="rowfilter" data-target="#countBody" placeholder="搜尋料號或品名" style="max-width:240px">
    <div class="tablebox"><table><thead><tr><th>料號</th><th>品名</th><th>類別</th><th class="n">系統數量</th><th class="n">實際數量</th><th>單位</th></tr></thead><tbody id="countBody">${rows}</tbody></table></div>
    <div class="row"><button type="submit" class="btn primary">存檔盤點，庫存從這天重新起算</button></div>
  </form>`;
}
document.addEventListener('change',e=>{if(e.target.id==='countDate'&&page==='count'){countDate=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='countForm')return;e.preventDefault();if(!can('items'))return;
  const date=$('#countDate').value;if(!date){toast('請選盤點日');return}
  const qty={};document.querySelectorAll('.cnt').forEach(x=>{qty[x.dataset.id]=x.value===''?0:+x.value});
  const by=$('#countBy').value.trim()||(role==='admin'?'管理者':'一般人員');
  const before=S.count?S.count.date:'無';
  S.count={date,qty,at:new Date().toLocaleString('zh-TW',{hour12:false}),by};
  S.audit.unshift({no:'盤點',action:'修改',at:S.count.at,by,reason:'盤點重設',changes:['盤點日：'+before+' → '+date]});
  save();countDate='';go('home');toast('已存檔盤點，庫存從 '+date+' 重新起算')});
document.addEventListener('click',e=>{if(e.target.id!=='countClear'||!can('items'))return;
  if(!confirm('確定取消盤點嗎？庫存會改回用原本的期初數量計算。'))return;
  const at=new Date().toLocaleString('zh-TW',{hour12:false});
  S.audit.unshift({no:'盤點',action:'修改',at,by:role==='admin'?'管理者':'一般人員',reason:'取消盤點',changes:['盤點日：'+S.count.date+' → 無']});
  delete S.count;save();render();toast('已取消盤點')});

function afterLoad(){
if(!S.perm)S.perm={pin:'',staff:{edit:false,del:false,back:false,items:false,bom:false,contactAdd:true,contactEdit:false,data:false}};
try{role=sessionStorage.getItem('erp-role')||''}catch(e){role=''}
if(role!=='admin'&&role!=='staff')role=S.perm.pin?'staff':'admin';
if(!S.perm.pin)role='admin';
if(!S.audit)S.audit=[];
migrate();save();
renderRole();renderTabs();render();
}
connect();
</script>
</body>
</html>
