<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小團隊進銷存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: top bar with page tabs, one working column below; documents open as an A4 sheet over the page */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --line:#d3dbd8;
  --fg:#1c2624; --muted:#5d6b67; --accent:#1f5f5b; --accent-fg:#ffffff; --accent-soft:#dcebe8;
  --warn:#a3541a; --warn-soft:#f6e4d4; --ok:#2f6b3a; --ok-soft:#dfeedd; --bad:#a3302a; --bad-soft:#f6dcda;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#999999; --shade:rgba(20,30,28,.55);
  --f-body:"DFKai-SB","BiauKai","標楷體","Kaiti TC","STKaiti","LXGW WenKai TC",serif;
  --f-head:"DFKai-SB","BiauKai","標楷體","Kaiti TC","STKaiti","LXGW WenKai TC",serif;
  --f-num:"DFKai-SB","BiauKai","標楷體","Kaiti TC","STKaiti","LXGW WenKai TC",serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2220; --surface-2:#222c29; --line:#33403c;
  --fg:#e3ebe8; --muted:#9aaba6; --accent:#6fbab2; --accent-fg:#0d1513; --accent-soft:#1f3532;
  --warn:#e7a26b; --warn-soft:#3a2a1c; --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ec8e86; --bad-soft:#3d2120; --shade:rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2220; --surface-2:#222c29; --line:#33403c;
  --fg:#e3ebe8; --muted:#9aaba6; --accent:#6fbab2; --accent-fg:#0d1513; --accent-soft:#1f3532;
  --warn:#e7a26b; --warn-soft:#3a2a1c; --ok:#8fcf98; --ok-soft:#1f3322; --bad:#ec8e86; --bad-soft:#3d2120; --shade:rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand h1{font-family:var(--f-head);font-size:20px;margin:0;letter-spacing:.02em}
.brand .tag{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}
.brand .spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-head);font-size:22px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:4px 0 0;max-width:62ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.tile .v{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile.alert .v{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tablebox{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:var(--surface-2)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-bottom:0}
.mono{font-family:var(--f-num);font-size:13px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos figure{margin:0;position:relative}
.photos img{width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.photos .x{position:absolute;top:2px;right:2px;border:0;border-radius:99px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.custom{border-left:4px solid var(--warn);padding:10px 12px;background:var(--warn-soft);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.custom .spec{white-space:pre-wrap}
#lightbox{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.85);display:grid;place-items:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:94vh;object-fit:contain}
.equip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 16px}
@media (max-width:900px){.equip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.equip{grid-template-columns:minmax(0,1fr)}}
.eqgrp{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.eqsub{padding-left:22px}
.eqlist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 16px}
.eqlist label{display:flex;gap:6px;align-items:flex-start;font-size:14px}
.eqlist input{width:auto;flex:none;margin-top:4px}
@media (max-width:700px){.eqlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.equip .eq{display:grid;grid-template-columns:minmax(0,auto) minmax(70px,1fr);gap:8px;align-items:center}
.equip .eq label{display:flex;gap:6px;align-items:center;font-size:14px}
.equip .eq input[type=checkbox]{width:auto}
.exbox{max-height:380px;overflow-y:auto}
html{overflow-anchor:none}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:500}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.pill.mid{color:var(--accent);background:var(--accent-soft)}
button.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
button.btn.small{padding:4px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.line.noprice{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) auto}
@media (max-width:520px){.line,.line.noprice{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.line label.f:first-child{grid-column:1/-1}}
.sub{font-size:13px;font-weight:700;color:var(--fg);margin:4px 0 0}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty{color:var(--muted);padding:12px 0}
/* A4 sheet */
.overlay{position:fixed;inset:0;background:var(--shade);z-index:20;overflow-y:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheetbar{max-width:794px;margin:0 auto 10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.paper{max-width:794px;margin:0 auto;background:var(--paper);color:var(--paper-ink);aspect-ratio:210/297;padding:5.5% 6.5%;display:flex;flex-direction:column;gap:14px;font-size:clamp(10px,1.7vw,13.5px);box-shadow:0 6px 30px rgba(0,0,0,.25)}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--paper-ink);padding-bottom:8px;gap:10px}
.paper .co{font-size:.9em}
.paper h3{font-family:var(--f-head);font-size:1.9em;margin:0;letter-spacing:.2em}
.paper .meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.paper .meta span{color:#555}
.paper table{font-size:1em}
.paper th{background:#eeeeee;color:var(--paper-ink);border:1px solid var(--paper-line);font-size:.92em}
.paper td{border:1px solid var(--paper-line);white-space:normal}
.paper tfoot td{border:1px solid var(--paper-line)}
.paper .grow{flex:1}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper .sign div{border:1px solid var(--paper-line);height:5.5em;padding:4px 6px;font-size:.9em;color:#555}
.paper .foot{font-size:.8em;color:#777;text-align:center}
@page{size:A4 portrait;margin:10mm}
@media print{
  header.top,main,.toast,.sheetbar,body::before{display:none!important}
  .overlay{position:static;background:none;padding:0;overflow:visible}
  .paper{max-width:none;width:100%;aspect-ratio:auto;min-height:0;box-shadow:none;padding:0;font-size:10pt;gap:8px}
  .paper th,.paper td{padding:2px 6px;line-height:1.35}
  .paper .sign div{height:3.6em}
  .paper tfoot{display:table-row-group}
  .paper .grow{display:none}
  body{background:#fff}
  .paper.combo{min-height:272mm;font-size:9.5pt;gap:6px}
  .paper.combo .grow{display:block}
  .paper.combo th,.paper.combo td{padding:2px 6px}
  .paper.combo .rcpt{break-inside:avoid}
}
/* 銷貨出貨單＋收據 合併在同一張 A4：上半出貨單、下半收據 */
.paper.combo{gap:10px}
.paper.combo .sign div{height:3.6em}
.paper .cut{border-top:1px dashed #999;margin:4px 0 2px;text-align:center;font-size:.8em;color:#888;line-height:0}
.paper .cut span{background:var(--paper);padding:0 8px}
.paper .rcpt td{padding:.2em .45em}
.paper.combo .rcpt .rt{font-size:1.6em}
.paper.combo .meta{gap:2px 20px}
.rcpt-label{max-width:794px;margin:18px auto 8px;color:#fff;font-size:14px}
.paper.rcpt{aspect-ratio:auto;padding:4% 5%;gap:0;font-size:clamp(10px,1.6vw,13px)}
.rcpt table{border-collapse:collapse;width:100%}
.rcpt td{border:1px solid var(--paper-ink);padding:.35em .5em;text-align:center;white-space:nowrap}
.rcpt td.n{text-align:right;font-family:var(--f-num)}
.rcpt td.nb{border:0}
.rcpt .rt{font-family:var(--f-head);font-size:2em;font-weight:700;letter-spacing:.15em}
.rcpt .rc{font-size:1.4em}
.rcpt .stamp{vertical-align:top;color:#666;font-size:1.2em}
.rcpt .cap{font-size:1.3em;font-weight:700;letter-spacing:.05em}
.rcpt .sbox{text-align:center;vertical-align:middle;padding:.3em}
.rcpt .sbox img{max-width:90%;max-height:9em;object-fit:contain}
.rcpt .seal{width:5.5em;padding:.2em}
.rcpt .seal img{width:4.6em;height:4.6em;object-fit:contain;display:block;margin:auto}
.stamp-prev{width:120px;height:90px;object-fit:contain;border:1px dashed var(--line);background:#fff}
.pinfo{background:var(--accent-soft);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;font-size:14px}
.pinfo span{color:var(--muted);font-size:12px;margin-right:4px}
.pinfo .full{grid-column:1/-1}
.pinfo.miss{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft)}
.prog{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.prog i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.prog i.on{background:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.steps li{border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted);min-width:0}
.steps li b{display:block;color:var(--fg);font-size:14px}
.steps li.done{border-color:var(--accent)}
.steps li.cur{border-color:var(--warn)}
.steps li.cur b{color:var(--warn)}
@media (max-width:520px){.steps{grid-auto-flow:row}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .3s}}
.fc-box>summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;cursor:pointer;list-style:none}
.fc-box>summary::-webkit-details-marker{display:none}
.fc-box>summary::before{content:'▸';color:var(--accent);font-size:14px}
.fc-box[open]>summary::before{content:'▾'}
.fc-box>summary .sub{margin:0}
.fc-box[open]{display:flex;flex-direction:column;gap:12px}
.fc-box:not([open]){display:block;padding:12px 16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>小團隊進銷存</h1>
      <span class="tag" id="syncTag">線上版・連線中…</span>
      <span class="spacer"></span>
      <span id="userBox" style="font-size:13px"></span>
      <span id="roleBox" style="font-size:13px"></span>
      <button class="link" id="backup" type="button">備份資料</button>
      <button class="link" id="restoreBtn" type="button">還原備份</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      <button class="link" id="reset" type="button">重設為初始資料</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="頁面"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="dls" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
/* Firebase Realtime Database 存檔：資料放在 jxc/ 底下，不會動到舊 erp-app 的 erp/ 資料 */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyACV9lvcVKHa8q_Lmdzyg-U1SzmlsGz9Uo",
  authDomain:"erp-app-90278.firebaseapp.com",
  databaseURL:"https://erp-app-90278-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"erp-app-90278",
  storageBucket:"erp-app-90278.firebasestorage.app",
  messagingSenderId:"58148662994",
  appId:"1:58148662994:web:c19221105ba36b0b45470b"
};
(function(){
  const ROOT='jxc';
  let fdb=null,auth=null;
  try{firebase.initializeApp(FIREBASE_CONFIG);fdb=firebase.database();auth=firebase.auth()}catch(e){console.error('Firebase 初始化失敗',e)}
  // Each record is stored as one JSON string so empty arrays and special keys survive the round trip.
  const enc=d=>({j:JSON.stringify(d)});
  const dec=v=>{try{return v&&typeof v.j==='string'?JSON.parse(v.j):null}catch(e){return null}};
  const mapErr=e=>({code:/permission/i.test(String(e&&(e.code||e.message)))?'permission_denied':'unavailable',message:String(e&&e.message||e)});
  const docRef=p=>{const r=fdb.ref(ROOT+'/'+p),id=p.split('/').pop();return{id,path:p,
    get:async()=>{try{const s=await r.get();const d=dec(s.val());return{exists:d!==null,data:()=>d}}catch(e){throw mapErr(e)}},
    set:async d=>{try{await r.set(enc(d))}catch(e){throw mapErr(e)}},
    delete:async()=>{try{await r.remove()}catch(e){throw mapErr(e)}},
    onSnapshot:(fn,err)=>{const cb=s=>{const d=dec(s.val());fn({id,exists:d!==null,data:()=>d,metadata:{}})};
      r.on('value',cb,e=>err&&err(mapErr(e)));return()=>r.off('value',cb)}}};
  const collRef=c=>({path:c,doc:id=>docRef(c+'/'+id),
    onSnapshot:(fn,err)=>{const r=fdb.ref(ROOT+'/'+c);let prev=new Map();
      const cb=s=>{const cur=new Map();s.forEach(ch=>{const v=ch.val();cur.set(ch.key,v&&v.j)});const changes=[];
        for(const [k,j] of cur){if(prev.get(k)===j)continue;const d=dec({j});if(d===null)continue;
          changes.push({type:prev.has(k)?'modified':'added',doc:{id:k,exists:true,data:()=>d}})}
        for(const [k,j] of prev)if(!cur.has(k))changes.push({type:'removed',doc:{id:k,exists:true,data:()=>dec({j})}});
        prev=cur;fn({docChanges:()=>changes,metadata:{}})};
      r.on('value',cb,e=>err&&err(mapErr(e)));return()=>r.off('value',cb)}});
  const db=fdb&&{doc:docRef,collection:collRef};

  // Google 登入：只有 OWNER 和 jxcMembers 名單裡的帳號能讀寫資料（由 Firebase 規則把關）。
  const OWNER='jason010417@gmail.com';
  const mkey=e=>String(e||'').trim().toLowerCase().replace(/\./g,',');
  let resolveDb;const dbReady=new Promise(r=>resolveDb=r);let opened=false;
  window.claude={use:async n=>n==='db'?(db?dbReady:null):null};
  const gate=html=>{const m=document.getElementById('main');if(m)m.innerHTML='<section class="panel" style="max-width:460px;margin:8vh auto;text-align:center">'+html+'</section>'};
  const esc2=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function userBox(u){const b=document.getElementById('userBox');if(b)b.innerHTML=u?esc2(u.email)+' <button type="button" class="link" id="signOut">登出</button>':''}
  window.jxcAuth={
    owner:OWNER,
    email:()=>auth&&auth.currentUser&&auth.currentUser.email,
    isOwner:()=>!!(auth&&auth.currentUser&&auth.currentUser.email&&auth.currentUser.email.toLowerCase()===OWNER),
    members:async()=>{const s=await fdb.ref('jxcMembers').get();const v=s.val()||{};return Object.keys(v).filter(k=>v[k]===true).map(k=>k.replace(/,/g,'.'))},
    addMember:e=>fdb.ref('jxcMembers/'+mkey(e)).set(true),
    removeMember:e=>fdb.ref('jxcMembers/'+mkey(e)).remove()
  };
  if(!auth)return;
  document.addEventListener('click',e=>{
    if(e.target.id==='signIn'){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{
      if(err&&err.code==='auth/popup-blocked'||err&&err.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      else if(!(err&&err.code==='auth/popup-closed-by-user'))alert('登入失敗：'+(err&&err.message||err))})}
    if(e.target.id==='signOut'){auth.signOut().then(()=>location.reload())}
  });
  auth.onAuthStateChanged(async u=>{
    userBox(u);
    if(!u){gate('<h2>小團隊進銷存</h2><p class="lead">請用公司同仁的 Google 帳號登入。</p><button type="button" class="btn primary" id="signIn">用 Google 帳號登入</button>');return}
    if(opened)return;

<script>

const SEED={"sources": [["L", "LINE詢問"], ["T", "電話詢問"], ["S", "蝦皮下訂"], ["E", "官網下訂"], ["O", "其他"]]};


const FLOW={
  PO:[{k:'order',t:'下單',done:'已下單'},{k:'recv',t:'到貨驗收',done:'已到貨'},{k:'pay',t:'付款',done:'已付款'}],
  SO:[{k:'order',t:'接單',done:'已接單'},{k:'ready',t:'備貨完成',done:'已備貨'},{k:'ship',t:'出貨',done:'已出貨'},{k:'pay',t:'收款',done:'已收款'}],
  XF:[{k:'order',t:'接單',done:'已接單'},{k:'ready',t:'備貨完成',done:'已備貨'},{k:'ship',t:'出貨',done:'已出貨'},{k:'arrive',t:'到貨確認',done:'已到貨'}]
};
// 調撥單是銷貨單的一種（d.xfer）：一樣出貨扣庫存，但不算營收、不收款，最後一步是到貨確認。
const flowOf=d=>d.xfer?FLOW.XF:FLOW[d.kind];
const PAY_METHODS=['現金','匯款','支票','LINE Pay','刷卡','其他'];
const STOCK_AT={PO:2,SO:3};
const stepN=d=>flowOf(d)?(d.steps||[]).length:0;
const flowDone=d=>!flowOf(d)||stepN(d)>=flowOf(d).length;
const counts=d=>!STOCK_AT[d.kind]||stepN(d)>=STOCK_AT[d.kind];
function migrate(){S.docs.forEach(d=>{if(!FLOW[d.kind]||d.steps)return;const F=FLOW[d.kind];
  d.steps=F.map(()=>({at:d.date,by:''}));if(d.kind==='SO'&&(d.paid||0)<amount(d))d.steps.pop()})}
const PERMS=[['edit','修改單據（會留下修改紀錄）'],['del','刪除單據'],['back','退回流程步驟'],['items','新增、修改品項（價格、期初、安全庫存、匯入）'],['bom','設定 BOM'],['contactAdd','新增顧客／廠商'],['contactEdit','修改既有的顧客／廠商資料'],['data','重設資料、還原備份']];
function hashPw(t){let h=5381;for(const c of 'erp|'+t)h=((h<<5)+h+c.codePointAt(0))>>>0;return 'h'+h.toString(36)+t.length}
let role='admin';
function can(k){return role==='admin'||!!(S.perm&&S.perm.staff[k])}
const COMPANY={name:'觀心園愛心庇護工場',line:'南投縣草屯鎮中正路557之55號　TEL：049-2561763　E-mail：ksy20250101@gmail.com'};
/* ---------- 線上同步：資料存在雲端，大家共用 ---------- */
// Each item, document, customer, vendor and audit entry is one cloud document; everything else (BOM, permissions, flags) lives in erp/meta.
const COLL={items:{key:e=>e.id},docs:{key:e=>e.no},customers:{key:e=>e._k},vendors:{key:e=>e._k},audit:{key:e=>e._k,desc:true}};
let S=null,db=null,ready=false,readOnly=false,syncErr='';const STAMPS={};
const shadow=new Map(),remote={},pend=new Map(),inflight=new Set(),created=new Set();let order=[],running=0;
Object.keys(COLL).forEach(k=>remote[k]=new Map());
let metaData,got=new Set();
const clone=v=>JSON.parse(JSON.stringify(v));
function canon(v){if(Array.isArray(v))return'['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
function pid(s){s=String(s);return /^[A-Za-z0-9_\-~:@+]{1,200}$/.test(s)?s:'u'+[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,190)}
const newKey=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function save(){
  if(!ready)return;
  if(readOnly){toast('你目前只能查看，這次的變更不會存到雲端');return}
  const want=new Map();
  for(const [k,c] of Object.entries(COLL)){
    const arr=S[k]||(S[k]=[]);let top=arr.reduce((m,e)=>Math.max(m,typeof e._o==='number'?e._o:-1),-1);
    arr.forEach(e=>{if(k!=='items'&&k!=='docs'&&!e._k)e._k=newKey(k[0]);
      if(typeof e._o!=='number')e._o=c.desc?Date.now()+Math.random():++top;
      want.set(k+'/'+pid(c.key(e)),canon(e))});
  }
  const meta={};Object.keys(S).forEach(k=>{if(!COLL[k])meta[k]=S[k]});want.set('erp/meta',canon(meta));
  for(const [p,j] of want)if(shadow.get(p)!==j){if(!shadow.has(p)&&p.startsWith('docs/'))created.add(p);shadow.set(p,j);enqueue(p,JSON.parse(j))}
  for(const p of [...shadow.keys()])if(!want.has(p)){shadow.delete(p);enqueue(p,null)}
}
function enqueue(p,data){if(!pend.has(p))order.push(p);pend.set(p,data);pump()}
function pump(){
  for(let i=0;i<order.length&&running<4;){const p=order[i];if(inflight.has(p)){i++;continue}
    order.splice(i,1);const data=pend.get(p);pend.delete(p);inflight.add(p);running++;
    write(p,data).finally(()=>{inflight.delete(p);running--;pump();syncTag()})}
  syncTag();
}
async function write(p,data,tries=0){
  const [c,id]=p.split('/');const ref=db.collection(c).doc(id);
  try{
    if(data!==null&&created.has(p)){created.delete(p);const cur=await ref.get();
      if(cur.exists&&canon(cur.data())!==canon(data)){renameDoc(data.no);return}}
    if(data===null)await ref.delete();else await ref.set(data);
    syncErr='';
  }catch(e){
    const code=e&&e.code;
    if((code==='unavailable'||code==='resource_exhausted')&&tries<6){await sleep(600*2**tries+Math.random()*400);return write(p,data,tries+1)}
    if(code==='permission_denied'){syncErr='Firebase 拒絕存檔，請檢查資料庫規則';toast(syncErr)}
    else if(code==='invalid_argument'&&!readOnly&&data!==null&&canon(data).length<250000){readOnly=true;syncErr='你目前只能查看，不能修改資料';toast(syncErr)}
    else if(code==='quota_exceeded'){syncErr='雲端空間已滿，請聯絡管理者';toast(syncErr)}
    else{syncErr='有資料沒存成功，請重新整理頁面';toast(syncErr)}
  }
}
// Someone else saved a document with the same number at the same time: give ours the next number.
function renameDoc(no){
  const d=S.docs.find(x=>x.no===no);if(!d)return;
  shadow.delete('docs/'+pid(no));
  d.no=nextNo(d.kind,d.date);S.audit.forEach(g=>{if(g.no===no)g.no=d.no});
  save();toast('單號 '+no+' 剛被別人用掉，已改為 '+d.no);scheduleRender();
}
function syncTag(){
  const el=$('#syncTag');if(!el)return;
  const n=pend.size+inflight.size;
  el.textContent=!ready?'線上版・連線中…':readOnly?'線上版・只能查看':syncErr?'線上版・'+syncErr:n?'線上版・儲存中（'+n+'）':'線上版・已同步';
  el.style.color=syncErr&&!readOnly?'var(--bad)':'';
}
window.addEventListener('beforeunload',e=>{if(pend.size+inflight.size){e.preventDefault();e.returnValue=''}});

// Remote changes update objects in place so open screens keep valid references.
function rebuild(k){
  const desc=COLL[k].desc,key=COLL[k].key;
  const old=new Map((S[k]||[]).map(e=>[pid(key(e)),e]));
  const pathBusy=id=>pend.has(k+'/'+id)||inflight.has(k+'/'+id);
  const out=[];
  for(const [id,data] of remote[k]){
    const o=old.get(id);
    if(o&&pathBusy(id)){out.push(o);continue}
    if(o){if(canon(o)!==canon(data)){Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,clone(data))}out.push(o)}
    else out.push(clone(data));
  }
  for(const [id,o] of old)if(!remote[k].has(id)&&pathBusy(id))out.push(o);
  out.sort((a,b)=>desc?(b._o||0)-(a._o||0):(a._o||0)-(b._o||0));
  S[k]=out;
}
function rebuildMeta(){
  Object.keys(S).forEach(k=>{if(!COLL[k])delete S[k]});
  if(metaData)Object.assign(S,clone(metaData));
}
function onData(){
  if(got.size<Object.keys(COLL).length+1)return;
  if(!ready){
    if(!metaData){$('#main').innerHTML='<p class="empty">雲端還沒有資料。</p>';
      ready=true;S.bom={};S.perm=null;S.svcInit=true;S.histImported=true;afterLoad();return}
    ready=true;
    if(!S.bom)S.bom={};
    afterLoad();syncTag();return;
  }
  scheduleRender();
}
let renderT=0,stale=false;
function busy(){const a=document.activeElement;return !$('#overlay').hidden||formOpen||!!editing||!!(a&&a.closest&&a.closest('#main')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.classList.contains('rowfilter'))}
function scheduleRender(){clearTimeout(renderT);renderT=setTimeout(()=>{if(busy()){stale=true;return}stale=false;renderRole();renderTabs();render()},200)}
setInterval(()=>{if(stale&&ready&&!busy()){stale=false;renderRole();renderTabs();render()}},1500);

async function connect(){
  S={};
  $('#main').innerHTML='<p class="empty">正在讀取雲端資料…</p>';
  db=window.claude&&await window.claude.use('db');
  if(!db){$('#main').innerHTML='<p class="empty">連不上 Firebase，請檢查網路後重新整理頁面。</p>';$('#syncTag').textContent='線上版・未連線';return}
  try{const user=await window.claude.use('user');if(user&&user.can&&(await user.can('data.write'))===false){readOnly=true}}catch(e){}
  const fail=e=>{syncErr='連線中斷，請重新整理頁面';syncTag()};
  for(const k of Object.keys(COLL)){
    db.collection(k).onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{const p=k+'/'+ch.doc.id;
        if(ch.type==='removed'){remote[k].delete(ch.doc.id);if(!pend.has(p)&&!inflight.has(p))shadow.delete(p)}
        else{const d=ch.doc.data();remote[k].set(ch.doc.id,d);if(!pend.has(p)&&!inflight.has(p))shadow.set(p,canon(d))}});
      got.add(k);rebuild(k);onData();
    },fail);
  }
  ['receipt','owner'].forEach(k=>db.doc('stamps/'+k).onSnapshot(snap=>{const d=snap.exists&&snap.data();if(d&&d.src)STAMPS[k]=d.src;else delete STAMPS[k];if(ready)scheduleRender()},()=>{}));
  db.doc('erp/meta').onSnapshot(snap=>{
    metaData=snap.exists?snap.data():null;
    if(!pend.has('erp/meta')&&!inflight.has('erp/meta')){if(snap.exists)shadow.set('erp/meta',canon(metaData));rebuildMeta()}
    got.add('meta');onData();
  },fail);
}

let page='home';
try{page=localStorage.getItem(KEY+'-page')||'home'}catch(e){}
if(!PAGES.some(p=>p[0]===page)&&page!=='perm'&&page!=='count')page='home';
const hist={side:'SO',name:'',from:'',to:'',item:''};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('zh-TW');
const money=n=>'$'+fmt(Math.round(n||0));
const item=id=>S.items.find(i=>i.id===id)||{name:'(已刪除品項)',code:'',unit:'',type:''};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// 外展單的「其它」列（工藝品、植栽）用 l.other + l.name，沒有料號，不算庫存。
const lname=l=>l.other?l.name:item(l.item).name,lcode=l=>l.other?'':item(l.item).code,exPrice=l=>l.price??(l.other?0:item(l.item).price)??0;
const exSales=d=>d.returned?d.lines.reduce((a,l)=>a+(l.qty-(l.ret||0))*exPrice(l),0):0;
// 設備清單：一般設備，加上三台機器；機器勾了才展開它的配件（g = 所屬機器）。
const EQ_BASE=['零用金','捐款箱','LinePay','TWQR','桌巾','外展桌','板凳','電風扇','收據','價格牌','酒精','衛生紙','延長線','大洋傘+腳'];
const EQ_GROUPS=[['爆米花機',['試吃罐','鹹甜 2KG 裝爆米花','免洗杯','湯匙','手套']],['棉花糖機',['竹籤','飲用水','溫度計']],['茶桶',['免洗杯']]];
const EQUIP=[...EQ_BASE.map(n=>({n,g:''})),...EQ_GROUPS.flatMap(([m,subs])=>[{n:m,g:''},...subs.map(n=>({n,g:m}))])];
const eqName=n=>n.replace('（只有保溫功能）','');
const eqLabel=q=>q.g?q.g+'－'+q.n:eqName(q.n);
const eqIdx=q=>{const n=eqName(q.n),g=q.g||'';let i=EQUIP.findIndex(e=>e.n===n&&e.g===g);if(i<0&&!g)i=EQUIP.findIndex(e=>e.n===n);return i};
// 採購單到貨驗收後，數量與金額都以驗收數量（l.acc）為準。
const lq=(d,l)=>d.kind==='PO'&&l.acc!=null?l.acc:l.qty;
const amount=d=>d.lines.reduce((a,l)=>a+(lq(d,l)||0)*(l.price||0),0)+(d.fee||0)+(d.discount||0);
// 舊的採購單沒有記已付金額：流程走到「付款」就當作已付清。
function paidOf(d){if(d.paid!=null)return d.paid;return d.kind==='PO'&&stepN(d)>=3?amount(d):0}
function payState(d){if(d.xfer)return['調撥','mid'];const a=amount(d),p=paidOf(d),w=d.kind==='PO'?'付':'收';if(p>=a&&a>0)return['已'+w,'ok'];if(p>0)return['部分'+w,'mid'];return['未'+w,'bad']}
function nextNo(kind,date){const p=kind+'-'+date.replace(/-/g,'')+'-';const n=S.docs.filter(d=>d.no.startsWith(p)).reduce((m,d)=>Math.max(m,parseInt(d.no.slice(p.length))||0),0)+1;return p+String(n).padStart(2,'0')}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

function effDate(d){const st=d.steps||[];if(d.kind==='PO'&&st[1])return st[1].at;if(d.kind==='SO'&&st[2])return st[2].at;return d.date}
// 盤點：S.count={date,qty:{itemId:數量}}；盤點日當天及之後的單據才會加減在盤點數量上。
const baseQty=i=>S.count?(+S.count.qty[i.id]||0):(+i.open||0);
const afterCount=dt=>!S.count||dt>=S.count.date;
function stockUntil(to,from){
  const useBase=!!S.count&&(!to||to>=S.count.date);
  const m={};S.items.forEach(i=>m[i.id]={in:0,out:0,bal:useBase?baseQty(i):(+i.open||0)});
  S.docs.forEach(d=>{if(!counts(d))return;const dt=effDate(d);if(to&&dt>to)return;const inR=!from||dt>=from;const inBal=!useBase||dt>=S.count.date;
    d.lines.forEach(l=>{const r=m[l.item];if(!r)return;let a=0,b=0;
      if(d.kind==='PO')a=lq(d,l);else if(d.kind==='MO'){if(l.dir==='use')b=l.qty;else a=l.qty}
      else if(d.kind==='EX'){b=l.qty;a=l.ret||0}else if(d.kind==='SO')b=l.qty;
      if(inBal)r.bal+=a-b;if(inR){if(d.kind==='EX')r.out+=b-a;else{r.in+=a;r.out+=b}}})});
  return m;
}
function stock(){
  const m={};
  S.items.forEach(i=>m[i.id]={open:baseQty(i),po:0,use:0,made:0,exOut:0,exRet:0,so:0});
  S.docs.forEach(d=>{if(!counts(d)||!afterCount(effDate(d)))return;d.lines.forEach(l=>{const r=m[l.item];if(!r)return;
    if(d.kind==='PO')r.po+=lq(d,l);
    else if(d.kind==='MO'){if(l.dir==='use')r.use+=l.qty;else r.made+=l.qty}
    else if(d.kind==='EX'){r.exOut+=l.qty;r.exRet+=l.ret||0}
    else if(d.kind==='SO')r.so+=l.qty;})});
  Object.values(m).forEach(r=>r.cur=r.open+r.po-r.use+r.made-r.exOut+r.exRet-r.so);
  return m;
}

function renderTabs(){
  $('#tabs').innerHTML=PAGES.concat(can('items')?[['count','盤點重設']]:[]).concat(role==='admin'?[['perm','權限設定']]:[]).map(([k,t])=>`<button type="button" data-p="${k}" ${k===page?'aria-current="page"':''}>${t}${k==='todo'&&ready&&S.docs?(n=>n?` <span class="pill bad">${n}</span>`:'')(todoCount()):''}</button>`).join('');

  if(!date){err.textContent='請填日期。';return}
  if(!party&&kind!=='MO'){err.textContent='請填'+k.party+'。';return}
  if(TAKER[kind]&&!$('#f-taker').value.trim()){err.textContent='請填'+TAKER[kind]+'。';$('#f-taker').focus();return}
  const exv=kind==='EX'?exFormVal():null;
  const lines=exv?exv.lines:[];
  if(!exv)e.target.querySelectorAll('.line').forEach(r=>{const it=r.querySelector('.li').value,q=+r.querySelector('.lq').value;const p=r.querySelector('.lp');
    if(it&&q>0){const l={item:it,qty:q};if(p)l.price=+p.value||0;if(r.dataset.dir)l.dir=r.dataset.dir;if(kind==='EX')l.ret=0;lines.push(l)}});
  if(!lines.length){err.textContent=kind==='EX'?'至少要填一項帶出的成品或其它品項的數量。':'至少要有一列選了品項、填了數量。';return}
  if(kind==='MO'&&!lines.some(l=>l.dir==='out')){err.textContent='請填完工的成品數量。';return}
  if(editing){const d=S.docs.find(x=>x.no===editing);if(!d||!can('edit'))return;
    const by=$('#f-editor').value.trim();if(!by){err.textContent='請填修改人。';return}
    if(kind==='PO')lines.forEach(l=>{const o=d.lines.find(x=>x.item===l.item&&x.acc!=null);if(o)l.acc=o.acc});
    if(kind==='EX')lines.forEach((l,i)=>{const o=d.lines.find(x=>l.other?x.other&&x.name===l.name:x.item===l.item);l.ret=o?Math.min(o.ret||0,l.qty):0;if(o&&o.price!=null)l.price=o.price});
    const sum=ls=>ls.map(l=>(l.dir==='use'?'[領用]':l.dir==='out'?'[完工]':'')+lname(l)+'×'+l.qty+(l.price!=null&&KINDS[kind].priced?'@'+l.price:'')).join('、');
    const ch=[];if(d.date!==date)ch.push(`日期：${d.date} → ${date}`);if(d.party!==(party||'—'))ch.push(`${k.party}：${d.party} → ${party||'—'}`);
    if(sum(d.lines)!==sum(lines))ch.push(`品項：${sum(d.lines)} → ${sum(lines)}`);
    const cu=kind==='SO'?customVal():null,av=kind==='SO'?arrVal():null;
    const ty=kind==='SO'?$('#f-type').value==='xfer':null,tk=TAKER[kind]?$('#f-taker').value.trim():null;
    if(ty!=null&&!!d.xfer!==ty)ch.push(`類型：${d.xfer?'調撥':'銷貨'} → ${ty?'調撥':'銷貨'}`);
    if(exv){const a=d.ev||{};if((a.link||'')!==exv.ev.link||(a.note||'')!==exv.ev.note)ch.push(`活動細節：${[a.link,a.note].filter(Boolean).join(' ')||'—'} → ${[exv.ev.link,exv.ev.note].filter(Boolean).join(' ')||'—'}`);
      if(equipText(d.equip)!==equipText(exv.equip))ch.push(`設備：${equipText(d.equip)||'—'} → ${equipText(exv.equip)||'—'}`)}
    if(tk!=null&&(d.taker||'')!==tk)ch.push(`${TAKER[kind]}：${d.taker||'—'} → ${tk||'—'}`);
    if(av&&arrText(d)!==arrText(av))ch.push(`到貨期間：${arrText(d)||'—'} → ${arrText(av)||'—'}`);
    if(cu&&(!!d.custom!==cu.custom||(d.spec||'')!==cu.spec))ch.push(`客訂：${d.custom?'是':'否'}${d.spec?'（'+d.spec+'）':''} → ${cu.custom?'是':'否'}${cu.spec?'（'+cu.spec+'）':''}`);
    if(!ch.length){err.textContent='沒有任何變更。';return}
    const entry={at:new Date().toLocaleString('zh-TW',{hour12:false}),by,reason:$('#f-reason').value.trim(),changes:ch};
    (d.log=d.log||[]).push(entry);S.audit.unshift({no:d.no,action:'修改',...entry});
    d.date=date;d.party=party||'—';d.lines=lines;if(d.steps&&d.steps[0])d.steps[0].at=date;
    if(ty!=null){if(ty)d.xfer=true;else delete d.xfer}
    if(exv){exv.equip.forEach(q=>{const o=(d.equip||[]).find(x=>eqLabel(x)===eqLabel(q));if(o&&o.back)q.back=true;if(o&&o.out)q.out=true});d.ev=exv.ev;d.equip=exv.equip}
    if(tk!=null){if(tk)d.taker=tk;else delete d.taker;if(d.steps&&d.steps[0]&&tk)d.steps[0].by=tk}
    if(av){if(av.arr)d.arr=av.arr;else delete d.arr;if(av.arr2)d.arr2=av.arr2;else delete d.arr2}
    if(cu){if(cu.custom){d.custom=true;d.spec=cu.spec;if(!d.pk)d.pk=newKey('p')}else{delete d.custom;delete d.spec}}
    save();const no=d.no;editing=null;formOpen=false;render();toast('已修改 '+no+'，並留下修改紀錄');openDoc(no);return}
  const doc={no:nextNo(kind,date),kind,date,party:party||'—',lines};
  if(kind==='SO'){doc.paid=0;const a=arrVal();if(a.arr)doc.arr=a.arr;if(a.arr2)doc.arr2=a.arr2;
    if($('#f-type').value==='xfer')doc.xfer=true}
  if(TAKER[kind]){const tk=$('#f-taker').value.trim();if(tk)doc.taker=tk}
  const cu=kind==='SO'?customVal():null;
  if(cu&&cu.custom){doc.custom=true;doc.spec=cu.spec;doc.pk=newKey('p');if(formPhotos.length){doc.photos=formPhotos.length;putPhotos(doc.pk,formPhotos.slice())}}
  formPhotos=[];
  if(kind==='EX'){doc.returned=false;doc.ev=exv.ev;doc.equip=exv.equip}
  if(kind==='PO')doc.paid=0;
  if(FLOW[kind])doc.steps=[{at:date,by:doc.taker||''}];
  S.docs.push(doc);save();formOpen=false;render();toast('已存檔 '+doc.no);openDoc(doc.no);
});

function exInfoHTML(d){const ev=d.ev||{};if(!ev.link&&!ev.note&&!(d.equip||[]).length)return '';
  const safe=/^https?:\/\//i.test(ev.link||'');
  return `${ev.link||ev.note?`<div class="pinfo" style="display:flex;flex-direction:column;gap:6px">`:''}${ev.link?`<div><b>活動連結：</b>${safe?`<a href="${esc(ev.link)}" target="_blank" rel="noopener">${esc(ev.link)}</a>`:esc(ev.link)}</div>`:''}${ev.note?`<div style="white-space:pre-wrap"><b>說明：</b>${esc(ev.note)}</div>`:''}${ev.link||ev.note?'</div>':''}${(d.equip||[]).length?`<p class="sub">帶出設備清單（出發前逐項勾「已帶出」，${d.equip.filter(q=>q.out).length}／${d.equip.length}）</p><div class="eqlist">${d.equip.map((q,i)=>`<label><input type="checkbox" class="eqo" data-i="${i}" ${q.out?'checked':''}>${esc(eqLabel(q))}${q.note?'（'+esc(q.note)+'）':''}</label>`).join('')}</div>`:''}`}
function exPaperExtra(d){const ev=d.ev||{},eq=d.equip||[];
  return `${eq.length?`<table><thead><tr><th>設備</th><th>數量／備註</th><th style="width:5em">帶出</th><th style="width:5em">帶回</th></tr></thead><tbody>${eq.map(q=>`<tr><td>${q.g?'　└ '+esc(q.n):esc(eqName(q.n))}</td><td>${esc(q.note||'')}</td><td style="text-align:center">${q.out?'☑':'☐'}</td><td style="text-align:center">${q.back?'☑':'☐'}</td></tr>`).join('')}</tbody></table>`:''}`}
function otherRow(o){return `<div class="line exo"><label class="f">品名（不算庫存）<input class="on" value="${esc(o?o.name:'')}" placeholder="例如：手作香包、多肉植栽"></label><label class="f">數量<input class="oq" type="number" min="0" step="any" inputmode="decimal" value="${o?o.qty:''}"></label><label class="f">售價（可留空）<input class="op" type="number" min="0" step="any" inputmode="decimal" value="${o&&o.price!=null?o.price:''}"></label><button type="button" class="btn small orm" aria-label="移除這一列">✕</button></div>`}
function exFormHTML(){const st=stock();
  return `<p class="sub">活動細節</p>
    <label class="f">活動連結<input id="f-evlink" type="url" inputmode="url" placeholder="https://"></label>
    <label class="f">文字說明<textarea id="f-evnote" rows="3" placeholder="時間、地點、聯絡人、注意事項⋯"></textarea></label>
    <p class="sub">設備確認（勾選這次要帶的）</p>
    ${eqFormHTML()}
    <div class="row between"><p class="sub">帶出的成品（填數量，沒帶的留空，不會印出來）</p><input class="rowfilter" data-target="#exBody" placeholder="搜尋成品" style="max-width:220px"></div>
    <div class="tablebox exbox"><table><thead><tr><th>料號</th><th>品名</th><th class="n">現有庫存</th><th style="width:110px">帶出數量</th></tr></thead><tbody id="exBody">${S.items.filter(i=>i.type==='成品').map(i=>`<tr><td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td><td class="n">${fmt(st[i.id]?st[i.id].cur:0)}</td><td><input class="exq" data-item="${i.id}" type="number" min="0" step="any" inputmode="decimal"></td></tr>`).join('')}</tbody></table></div>
    <p class="sub">其它（工藝品、植栽等，自己輸入，不算庫存）</p>
    <div id="exOther" style="display:flex;flex-direction:column;gap:8px">${otherRow()}</div>
    <div><button type="button" class="btn small" id="addOther">＋ 加一列</button></div>`}
function eqCell(i){const e=EQUIP[i];return `<div class="eq"><label><input type="checkbox" class="eqc" data-i="${i}" ${EQ_GROUPS.some(g=>g[0]===e.n)&&!e.g?`data-main="${e.n}"`:''}>${e.n}</label><input class="eqn" data-i="${i}" placeholder="${e.n==='零用金'?'金額':'數量／備註'}"></div>`}
function eqFormHTML(){const ix=f=>EQUIP.map((e,i)=>f(e)?i:-1).filter(i=>i>=0);
  return `<div class="equip">${ix(e=>!e.g&&EQ_BASE.includes(e.n)).map(eqCell).join('')}</div>
  ${EQ_GROUPS.map(([m])=>`<div class="eqgrp"><div class="equip">${eqCell(EQUIP.findIndex(e=>e.n===m&&!e.g))}</div><div class="equip eqsub" data-g="${m}" hidden>${ix(e=>e.g===m).map(eqCell).join('')}</div></div>`).join('')}`}
function eqSync(){document.querySelectorAll('.eqc[data-main]').forEach(c=>{const b=$(`.eqsub[data-g="${c.dataset.main}"]`);if(b)b.hidden=!c.checked})}
document.addEventListener('change',e=>{if(e.target.classList.contains('eqc')&&e.target.dataset.main)eqSync()});
function exFormVal(){
  const lines=[];document.querySelectorAll('.exq').forEach(x=>{const q=+x.value;if(q>0)lines.push({item:x.dataset.item,qty:q,ret:0})});
  document.querySelectorAll('#exOther .exo').forEach(r=>{const n=r.querySelector('.on').value.trim(),q=+r.querySelector('.oq').value,pv=r.querySelector('.op').value;
    if(n&&q>0){const l={other:true,name:n,qty:q,ret:0};if(pv!=='')l.price=+pv||0;lines.push(l)}});
  const on=new Set([...document.querySelectorAll('.eqc[data-main]')].filter(c=>c.checked).map(c=>c.dataset.main));
  const equip=[];document.querySelectorAll('.eqc').forEach(c=>{const e=EQUIP[+c.dataset.i];if(c.checked&&(!e.g||on.has(e.g))){const q={n:e.n,note:$(`.eqn[data-i="${c.dataset.i}"]`).value.trim()};if(e.g)q.g=e.g;equip.push(q)}});
  return {lines,ev:{link:$('#f-evlink').value.trim(),note:$('#f-evnote').value.trim()},equip};
}
const equipText=eq=>(eq||[]).map(e=>eqLabel(e)+(e.note?'('+e.note+')':'')).join('、');
document.addEventListener('click',e=>{
  if(e.target.id==='addOther'){$('#exOther').insertAdjacentHTML('beforeend',otherRow());return}
  const r=e.target.closest('.orm');if(r){const box=$('#exOther');if(box.children.length>1)r.closest('.exo').remove();else r.closest('.exo').querySelectorAll('input').forEach(i=>i.value='')}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('eqn')&&e.target.value){const c=$(`.eqc[data-i="${e.target.dataset.i}"]`);if(c){c.checked=true;eqSync()}}});
function arrVal(){const a=$('#f-arr1').value,b=$('#f-arr2').value;return a||b?{arr:a||b,arr2:a&&b&&b!==a?b:''}:{arr:'',arr2:''}}
function arrText(d){const f=x=>x?x.replace(/-/g,'/'):'';return d.arr?f(d.arr)+(d.arr2?' ～ '+f(d.arr2):''):''}
function customVal(){const c=$('#f-custom');return c?{custom:c.checked,spec:$('#f-spec').value.trim()}:null}
function shrinkPhoto(f){return new Promise((ok,bad)=>{const r=new FileReader();r.onerror=bad;r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{
  const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}
async function putPhotos(pk,list){PH[pk]=list;try{if(list.length)await db.doc('photos/'+pk).set({list});else await db.doc('photos/'+pk).delete()}catch(e){toast('照片沒有存成功，請再試一次')}}
async function getPhotos(pk){if(PH[pk])return PH[pk];try{const s=await db.doc('photos/'+pk).get();PH[pk]=s.exists&&s.data().list||[]}catch(e){return []}return PH[pk]}
function thumbs(list,rm){return list.map((src,i)=>`<figure><img src="${src}" alt="成品照片 ${i+1}" data-zoom>${rm?`<button type="button" class="x" ${rm}="${i}" aria-label="移除這張照片">✕</button>`:''}</figure>`).join('')}
function customPanel(d){return `<div class="custom"><b>客訂單</b>${d.spec?`<div class="spec">${esc(d.spec)}</div>`:''}
  <div class="photos" id="docPhotos"><span class="hint">照片讀取中⋯</span></div>
  <div><label class="btn small">＋ 新增照片<input type="file" id="addPhoto" accept="image/*" multiple hidden></label></div></div>`}
async function showPhotos(d){const list=await getPhotos(d.pk);const box=$('#docPhotos');if(!box)return;
  box.innerHTML=list.length?thumbs(list,can('edit')?'data-rmphoto':''):'<span class="hint">還沒有照片。</span>'}
function curDoc(){const bar=$('.sheetbar');return bar&&S.docs.find(x=>x.no===bar.dataset.no)}
document.addEventListener('change',async e=>{
  if(e.target.id==='f-custom'){$('#customBox').hidden=!e.target.checked;return}
  if(e.target.id==='f-photos'){for(const f of e.target.files){try{formPhotos.push(await shrinkPhoto(f))}catch(x){toast('有一張照片讀不到')}}e.target.value='';$('#f-prev').innerHTML=thumbs(formPhotos,'data-rmfp');return}
  if(e.target.id==='addPhoto'){const d=curDoc();if(!d)return;if(!d.pk){d.pk=newKey('p');save()}const list=(await getPhotos(d.pk)).slice();
    for(const f of e.target.files){try{list.push(await shrinkPhoto(f))}catch(x){toast('有一張照片讀不到')}}e.target.value='';
    d.photos=list.length;save();await putPhotos(d.pk,list);showPhotos(d);toast('已新增照片')}
});
document.addEventListener('click',async e=>{const t=e.target;
  if(t.dataset.rmfp!=null){formPhotos.splice(+t.dataset.rmfp,1);$('#f-prev').innerHTML=thumbs(formPhotos,'data-rmfp');return}
  if(t.dataset.rmphoto!=null){const d=curDoc();if(!d||!can('edit')||!confirm('確定移除這張照片？'))return;const list=(await getPhotos(d.pk)).slice();list.splice(+t.dataset.rmphoto,1);
    d.photos=list.length;save();await putPhotos(d.pk,list);showPhotos(d);return}
  if(t.dataset.zoom!=null){const lb=document.createElement('div');lb.id='lightbox';lb.innerHTML=`<img src="${t.src}" alt="">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#lightbox')){$('#lightbox').remove();e.stopPropagation()}},true);

/* ---------- A4 單據 ---------- */
let delArm=false;
function fillEdit(){
  const d=S.docs.find(x=>x.no===editing);if(!d)return;
  $('#f-date').value=d.date;$('#f-party').value=d.party==='—'?'':d.party;showPartyInfo();
  if($('#f-type')){$('#f-type').value=d.xfer?'xfer':'sale';typeUI()}
  if($('#f-taker'))$('#f-taker').value=d.taker||'';
  if(d.kind==='EX'){$('#f-evlink').value=(d.ev&&d.ev.link)||'';$('#f-evnote').value=(d.ev&&d.ev.note)||'';
    (d.equip||[]).forEach(q=>{const i=eqIdx(q);if(i<0)return;$(`.eqc[data-i="${i}"]`).checked=true;$(`.eqn[data-i="${i}"]`).value=q.note||''});eqSync();
    d.lines.forEach(l=>{if(l.other)return;const x=$(`.exq[data-item="${l.item}"]`);if(x)x.value=l.qty});
    const os=d.lines.filter(l=>l.other);if(os.length)$('#exOther').innerHTML=os.map(otherRow).join('')}
  if($('#f-arr1')){$('#f-arr1').value=d.arr||'';$('#f-arr2').value=d.arr2||''}
  if($('#f-custom')){$('#f-custom').checked=!!d.custom;$('#f-spec').value=d.spec||'';$('#customBox').hidden=!d.custom}
  const names=[...new Set(S.docs.flatMap(x=>(x.log||[]).map(g=>g.by).concat((x.steps||[]).map(s=>s.by))).filter(Boolean))];
  $('#docForm').insertAdjacentHTML('beforeend',`<datalist id="st-bys2">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`);
  document.querySelectorAll('#docForm .lines').forEach(box=>{const dir=box.dataset.dir,type=box.dataset.type;const ls=d.lines.filter(l=>(l.dir||'')===dir);
    box.innerHTML='';(ls.length?ls:[null]).forEach(l=>{box.insertAdjacentHTML('beforeend',lineHTML(d.kind,type,dir));const r=box.lastElementChild;
      if(l){setPick(r.querySelector('.li'),l.item);r.querySelector('.lq').value=l.qty;const lp=r.querySelector('.lp');if(lp)lp.value=l.price??''}})});
  const sb=$('#docForm button[type=submit]');if(sb)sb.textContent='存檔修改';
  $('#docForm').scrollIntoView({block:'start'});
}
function logHTML(d){if(!d.log||!d.log.length)return '';
  return `<details><summary class="sub" style="cursor:pointer">修改紀錄（${d.log.length}）</summary><div class="tablebox"><table><thead><tr><th>時間</th><th>修改人</th><th>原因</th><th>變更內容</th></tr></thead><tbody>${d.log.slice().reverse().map(g=>`<tr><td>${esc(g.at)}</td><td>${esc(g.by)}</td><td>${esc(g.reason||'')}</td><td style="white-space:normal">${g.changes.map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table></div></details>`}
function openDoc(no){
  const d=S.docs.find(x=>x.no===no);if(!d)return;const k=KINDS[d.kind];delArm=false;
  let action='';
  if(d.kind==='EX')action=`${exInfoHTML(d)}<p class="sub">登記歸還、售價與捐款</p><div class="lines">${d.lines.map((l,i)=>`<div class="line"><label class="f">品項<input value="${esc(lname(l))}（帶出 ${l.qty}）" disabled></label><label class="f">歸還數<input id="ret-${i}" class="ret" type="number" min="0" max="${l.qty}" value="${l.ret||0}"></label><label class="f">售價<input id="prc-${i}" class="prc" type="number" min="0" step="any" value="${exPrice(l)}"></label><span></span></div>`).join('')}</div>
    ${(d.equip||[]).length?`<p class="sub">設備帶回確認</p><div class="eqlist">${d.equip.map((q,i)=>`<label><input type="checkbox" class="eqb" data-i="${i}" ${q.back?'checked':''}>${esc(eqLabel(q))}${q.note?'（'+esc(q.note)+'）':''}</label>`).join('')}</div>`:''}
    <div class="grid-f"><label class="f">捐款金額<input id="donIn" type="number" min="0" step="any" value="${d.donation||0}"></label></div>
    ${d.returned?`<div class="row"><span>銷售金額 <b class="mono">${money(exSales(d))}</b>，捐款 <b class="mono">${money(d.donation)}</b>，合計收入 <b class="mono">${money(exSales(d)+(d.donation||0))}</b></span></div>`:''}
    <div class="row"><button type="button" class="btn primary" id="saveRet">存檔</button><span class="hint">（帶出 − 歸還）× 售價 = 銷售金額</span></div>`;
  action+=payPanel(d);
  $('#overlay').innerHTML=`<div class="sheetbar" data-no="${d.no}">
    <div class="row between"><b class="mono">${d.no}</b><div class="row">${can('edit')?'<button type="button" class="btn small" id="editDoc">修改這張單</button>':''}${can('del')?'<button type="button" class="btn danger small" id="delDoc">刪除這張單</button>':''}<button type="button" class="btn small" id="closeDoc">關閉</button></div></div>
    ${d.custom?customPanel(d):''}${flowPanel(d)}${action}${logHTML(d)}<div class="row"><button type="button" class="btn" id="printDoc">列印${d.xfer?'調撥單':d.kind==='SO'?'出貨單＋收據':''}／存成 PDF</button><span class="hint">列印視窗選 A4、直向；要存 PDF 就在印表機選「另存為 PDF」。</span></div></div>${paperHTML(d)}`;
  $('#overlay').hidden=false;document.body.style.overflow='hidden';
  if(d.custom)showPhotos(d);
}
function paperHTML(d){
  const k=d.xfer?{...KINDS.SO,name:'調撥單',party:'調撥到',sign:['出貨人','收貨人','主管']}:KINDS[d.kind];let head,rows,foot='';
  if(d.kind==='MO'){head='<th>區分</th><th>料號</th><th>品名</th><th>單位</th><th class="n">數量</th>';
    rows=d.lines.map(l=>`<tr><td>${l.dir==='use'?'領用半成品':'完工成品'}</td><td>${esc(item(l.item).code)}</td><td>${esc(item(l.item).name)}</td><td>${esc(item(l.item).unit)}</td><td class="n">${fmt(l.qty)}</td></tr>`).join('');}
  else if(d.kind==='EX'){const pr=exPrice;head='<th>#</th><th>料號</th><th>品名</th><th class="n">帶出</th><th class="n">歸還</th><th class="n">售出</th><th class="n">售價</th><th class="n">金額</th>';
    rows=d.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(lcode(l))}</td><td>${esc(lname(l))}${l.other?'（其它）':''}</td><td class="n">${fmt(l.qty)}</td><td class="n">${d.returned?fmt(l.ret):''}</td><td class="n">${d.returned?fmt(l.qty-l.ret):''}</td><td class="n">${fmt(pr(l))}</td><td class="n">${d.returned?fmt((l.qty-l.ret)*pr(l)):''}</td></tr>`).join('');
    const t=d.lines.reduce((a,l)=>a+l.qty,0),r=d.lines.reduce((a,l)=>a+(l.ret||0),0);
    foot=`<tr><td colspan="3">合計</td><td class="n">${fmt(t)}</td><td class="n">${d.returned?fmt(r):''}</td><td class="n">${d.returned?fmt(t-r):''}</td><td></td><td class="n">${d.returned?fmt(exSales(d)):''}</td></tr><tr><td colspan="7">捐款</td><td class="n">${d.returned?fmt(d.donation):''}</td></tr><tr><td colspan="7">合計收入</td><td class="n">${d.returned?fmt(exSales(d)+(d.donation||0)):''}</td></tr>`;}
  else if(d.kind==='PO'){head='<th>#</th><th>料號</th><th>品名</th><th>單位</th><th class="n">訂購數量</th><th class="n">驗收數量</th><th class="n">單價</th><th class="n">金額</th>';
    rows=d.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(item(l.item).code)}</td><td>${esc(item(l.item).name)}</td><td>${esc(item(l.item).unit)}</td><td class="n">${fmt(l.qty)}</td><td class="n">${l.acc!=null?fmt(l.acc):''}</td><td class="n">${fmt(l.price)}</td><td class="n">${fmt(lq(d,l)*l.price)}</td></tr>`).join('');
    foot=(d.fee?`<tr><td colspan="7">運費</td><td class="n">${fmt(d.fee)}</td></tr>`:'')+(d.discount?`<tr><td colspan="7">折扣</td><td class="n">${fmt(d.discount)}</td></tr>`:'')+`<tr><td colspan="7">合計${d.lines.some(l=>l.acc!=null)?'（依驗收數量）':''}</td><td class="n">${fmt(amount(d))}</td></tr>`;
    if(stepN(d)>=2)foot+=`<tr><td colspan="7">已付</td><td class="n">${fmt(paidOf(d))}</td></tr><tr><td colspan="7">未付</td><td class="n">${fmt(amount(d)-paidOf(d))}</td></tr>`;}
  else{head='<th>#</th><th>料號</th><th>品名</th><th>單位</th><th class="n">數量</th><th class="n">單價</th><th class="n">金額</th>';
    rows=d.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(item(l.item).code)}</td><td>${esc(item(l.item).name)}</td><td>${esc(item(l.item).unit)}</td><td class="n">${fmt(l.qty)}</td><td class="n">${fmt(l.price)}</td><td class="n">${fmt(l.qty*l.price)}</td></tr>`).join('');
    foot=(d.fee?`<tr><td colspan="6">運費</td><td class="n">${fmt(d.fee)}</td></tr>`:'')+(d.discount?`<tr><td colspan="6">折扣</td><td class="n">${fmt(d.discount)}</td></tr>`:'')+`<tr><td colspan="6">合計</td><td class="n">${fmt(amount(d))}</td></tr>`;
    if(d.kind==='SO'&&!d.xfer)foot+=`<tr><td colspan="6">已收</td><td class="n">${fmt(d.paid)}</td></tr><tr><td colspan="6">未收</td><td class="n">${fmt(amount(d)-(d.paid||0))}</td></tr>`;}
  const combo=d.kind==='SO'&&!d.xfer;
  return `<div class="paper a4${combo?' combo':''}">
    <div class="ph"><div><div class="co"><b>${COMPANY.name}</b><br><span style="font-size:.85em;color:#555">${COMPANY.line}</span></div><h3>${k.name}</h3></div><div class="mono" style="color:var(--paper-ink)">${d.no}</div></div>

function capNum(n){n=Math.round(n);if(n===0)return '零';const D='零壹貳參肆伍陸柒捌玖',U=['','拾','佰','仟'],B=['','萬','億'];
  const groups=[];while(n>0){groups.push(n%10000);n=Math.floor(n/10000)}
  let out='';
  for(let g=groups.length-1;g>=0;g--){const part=groups[g];
    if(part===0){if(out&&!out.endsWith('零'))out+='零';continue}
    if(out&&part<1000&&!out.endsWith('零'))out+='零';
    let t='';for(let i=3;i>=0;i--){const dg=Math.floor(part/Math.pow(10,i))%10;
      if(dg===0){if(t&&!t.endsWith('零'))t+='零'}else t+=D[dg]+U[i]}
    out+=t.replace(/零$/,'')+B[g]}
  return out.replace(/零$/,'')}

function stampImg(f){return new Promise((ok,bad)=>{const r=new FileReader();r.onerror=bad;r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{
  const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)})}

function openBom(id){
  const it=S.items.find(i=>i.id===id);if(!it)return;const b=S.bom[id]||[],ed=can('bom');
  $('#overlay').innerHTML=`<div class="sheetbar" id="bomBox" data-id="${id}">
    <div class="row between"><b>${esc(it.code)} ${esc(it.name)} 的 BOM</b><button type="button" class="btn small" id="closeDoc">關閉</button></div>
    <p class="hint">做 1 個成品要用掉哪些半成品和包材。生產單按「依 BOM 自動帶入領料」就會照這裡算。</p>
    ${ed?`<div class="lines" id="bomLines">${(b.length?b:[{}]).map(c=>bomRow(c.item,c.qty)).join('')}</div>
    <div><button type="button" class="btn small" id="bomAdd">＋ 加一列</button></div>
    <div class="row"><button type="button" class="btn primary" id="bomSave">存檔 BOM</button></div>`
    :(b.length?`<div class="tablebox"><table><thead><tr><th>料號</th><th>品名</th><th class="n">用量</th></tr></thead><tbody>${b.map(c=>`<tr><td class="mono">${esc(item(c.item).code)}</td><td>${esc(item(c.item).name)}</td><td class="n">${c.qty}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">還沒有設定 BOM。</p>')+'<p class="hint">要修改 BOM 需要管理者權限。</p>'}
  </div>`;
  $('#overlay').hidden=false;document.body.style.overflow='hidden';
}
document.addEventListener('click',e=>{
  const ob=e.target.closest('.obom');if(ob){openBom(ob.dataset.id);return}
  if(e.target.id==='bomAdd'){$('#bomLines').insertAdjacentHTML('beforeend',bomRow('',''));return}
  const rm=e.target.closest('.brm');if(rm){rm.closest('.line').remove();return}
  if(e.target.id==='bomSave'){if(!can('bom'))return;const id=$('#bomBox').dataset.id;const comps=[];
    document.querySelectorAll('#bomLines .line').forEach(r=>{const i=r.querySelector('.bi').value,q=+r.querySelector('.bq').value;if(i&&q>0&&i!==id)comps.push({item:i,qty:q})});
    const it=S.items.find(x=>x.id===id);
    if(comps.length){S.bom[id]=comps;if(it.type!=='成品'){it.type='成品'}}else delete S.bom[id];
    save();closeDoc();render();toast(comps.length?'已存檔 '+it.name+' 的 BOM（'+comps.length+' 項）':'已清除 '+it.name+' 的 BOM');return}
});

let resetArm=false;
$('#reset').addEventListener('click',e=>{if(!can('data'))return;if(!resetArm){resetArm=true;e.target.textContent='再按一次確認重設';setTimeout(()=>{resetArm=false;e.target.textContent='重設為初始資料'},3000);return}
  resetArm=false;e.target.textContent='重設為初始資料';toast('線上版不提供重設')});

function setRole(r){role=r;try{sessionStorage.setItem('erp-role',r)}catch(e){}renderRole();if(!can('items')&&page==='perm')page='home';renderTabs();render()}
function renderRole(){
  const box=$('#roleBox');
  box.innerHTML=!S.perm.pin?'<button type="button" class="link" id="goPerm">設定管理者密碼</button>':
    `身分：<b>${role==='admin'?'管理者':'一般人員'}</b> <button type="button" class="link" id="${role==='admin'?'toStaff':'toAdmin'}">${role==='admin'?'切換成一般人員':'切換成管理者'}</button>`;
  $('#reset').hidden=true;$('#restoreBtn').hidden=!can('data');
}
document.addEventListener('click',e=>{
  if(e.target.id==='goPerm'){go('perm');return}
  if(e.target.id==='toStaff'){setRole('staff');toast('已切換成一般人員');return}
  if(e.target.id==='toAdmin'){
    $('#overlay').innerHTML=`<form class="sheetbar" id="pwForm" style="max-width:360px;margin-top:10vh"><p class="sub">輸入管理者密碼</p><input id="pwIn" type="password" autocomplete="current-password"><p class="err" id="pwErr"></p><div class="row"><button type="submit" class="btn primary">切換成管理者</button><button type="button" class="btn" id="closeDoc">取消</button></div></form>`;
    $('#overlay').hidden=false;$('#pwIn').focus();return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='pwForm')return;e.preventDefault();
  if(hashPw($('#pwIn').value)===S.perm.pin){closeDoc();setRole('admin');toast('已切換成管理者')}else $('#pwErr').textContent='密碼不對，請再試一次。'});

/* ---------- 盤點重設 ---------- */
let countDate='';
const dayBefore=ds=>{const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function countHTML(){
  const date=countDate||today();
  const sys=stockUntil(dayBefore(date));
  const cur=S.count;
  const rows=S.items.map(i=>`<tr><td class="mono">${esc(i.code)}</td><td>${esc(i.name)}</td><td>${i.type}</td><td class="n">${fmt(sys[i.id].bal)}</td><td class="n"><input class="cnt" data-id="${esc(i.id)}" type="number" step="any" value="${sys[i.id].bal}" style="max-width:110px;text-align:right"></td><td>${esc(i.unit)}</td></tr>`).join('');
  return `<div><h2>盤點重設</h2><p class="lead">在盤點日把實際點到的數量填進來，存檔後庫存就從這一天重新起算。盤點日當天和之後的單據會加減在盤點數量上，之前的單據不會被刪掉，只是不再影響庫存，歷史查詢還是看得到。</p></div>
  ${cur?`<section class="panel"><p class="sub" style="margin:0">目前的盤點：<b>${esc(cur.date)}</b>（${esc(cur.at||'')} ${esc(cur.by||'')} 存檔，共 ${Object.keys(cur.qty).length} 項）</p>
    <div class="row"><button type="button" class="btn" id="countClear">取消盤點，改回原本的期初計算</button></div></section>`:''}
  <form class="panel" id="countForm">
    <div class="grid-f"><label class="f">盤點日（這一天開始營業前的數量）<input type="date" id="countDate" value="${date}" required></label>
    <label class="f">盤點人<input id="countBy" placeholder="例如：小美"></label></div>
    <p class="hint">「系統數量」是盤點日前一天結束時系統算出的庫存，已經先填進「實際數量」；只要改有差異的品項就好。</p>
    <input class="rowfilter" data-target="#countBody" placeholder="搜尋料號或品名" style="max-width:240px">
    <div class="tablebox"><table><thead><tr><th>料號</th><th>品名</th><th>類別</th><th class="n">系統數量</th><th class="n">實際數量</th><th>單位</th></tr></thead><tbody id="countBody">${rows}</tbody></table></div>
    <div class="row"><button type="submit" class="btn primary">存檔盤點，庫存從這天重新起算</button></div>
  </form>`;
}
document.addEventListener('change',e=>{if(e.target.id==='countDate'&&page==='count'){countDate=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='countForm')return;e.preventDefault();if(!can('items'))return;
  const date=$('#countDate').value;if(!date){toast('請選盤點日');return}
  const qty={};document.querySelectorAll('.cnt').forEach(x=>{qty[x.dataset.id]=x.value===''?0:+x.value});
  const by=$('#countBy').value.trim()||(role==='admin'?'管理者':'一般人員');
  const before=S.count?S.count.date:'無';
  S.count={date,qty,at:new Date().toLocaleString('zh-TW',{hour12:false}),by};
  S.audit.unshift({no:'盤點',action:'修改',at:S.count.at,by,reason:'盤點重設',changes:['盤點日：'+before+' → '+date]});
  save();countDate='';go('home');toast('已存檔盤點，庫存從 '+date+' 重新起算')});
document.addEventListener('click',e=>{if(e.target.id!=='countClear'||!can('items'))return;
  if(!confirm('確定取消盤點嗎？庫存會改回用原本的期初數量計算。'))return;
  const at=new Date().toLocaleString('zh-TW',{hour12:false});
  S.audit.unshift({no:'盤點',action:'修改',at,by:role==='admin'?'管理者':'一般人員',reason:'取消盤點',changes:['盤點日：'+S.count.date+' → 無']});
  delete S.count;save();render();toast('已取消盤點')});

function afterLoad(){
if(!S.perm)S.perm={pin:'',staff:{edit:false,del:false,back:false,items:false,bom:false,contactAdd:true,contactEdit:false,data:false}};
try{role=sessionStorage.getItem('erp-role')||''}catch(e){role=''}
if(role!=='admin'&&role!=='staff')role=S.perm.pin?'staff':'admin';
if(!S.perm.pin)role='admin';
if(!S.audit)S.audit=[];
migrate();save();
renderRole();renderTabs();render();
}
connect();
</script>
</body>
</html>
